<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Outer Teal Circle -->
  <circle cx="32" cy="32" r="30" fill="#0C4A47" />
  <circle cx="32" cy="32" r="28" stroke="#D4AF37" stroke-width="1.5" stroke-dasharray="2 3" opacity="0.6" />
  
  <!-- Outer Golden Border -->
  <circle cx="32" cy="32" r="25" stroke="#D4AF37" stroke-width="1.8" opacity="0.8" />
  
  <!-- Cardinal Tick Marks -->
  <line x1="32" y1="4" x2="32" y2="10" stroke="#D4AF37" stroke-width="2" stroke-linecap="round" />
  <line x1="32" y1="54" x2="32" y2="60" stroke="#D4AF37" stroke-width="2" stroke-linecap="round" />
  <line x1="4" y1="32" x2="10" y2="32" stroke="#D4AF37" stroke-width="2" stroke-linecap="round" />
  <line x1="54" y1="32" x2="60" y2="32" stroke="#D4AF37" stroke-width="2" stroke-linecap="round" />
  
  <!-- North Star / Needle (Gold North, White South) -->
  <!-- North Gold Pointer -->
  <polygon points="32,10 36,32 32,28" fill="#F59E0B" />
  <polygon points="32,10 28,32 32,28" fill="#D97706" />
  
  <!-- South Needle -->
  <polygon points="32,54 36,32 32,36" fill="#CBD5E1" />
  <polygon points="32,54 28,32 32,36" fill="#94A3B8" />

  <!-- East Needle -->
  <polygon points="54,32 32,36 36,32" fill="#FBBF24" />
  <polygon points="54,32 32,28 36,32" fill="#D97706" />

  <!-- West Needle -->
  <polygon points="10,32 32,36 28,32" fill="#E2E8F0" />
  <polygon points="10,32 32,28 28,32" fill="#94A3B8" />
  
  <!-- Center Jewel Pivot -->
  <circle cx="32" cy="32" r="5" fill="#D4AF37" />
  <circle cx="32" cy="32" r="2.5" fill="#0C4A47" />
  <circle cx="31" cy="31" r="1" fill="#FFFFFF" />
</svg>
